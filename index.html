// 去重：相同领域、内容高度相似的只保留最早出现（最先报道）的一条
function dedupNews(data) {
  const result = [];
  const seen = {}; // key: field, value: [{index, fingerprint}]

  // 生成内容相似度指纹：CJK 字符走 bigram，非 CJK 走分词
  function fingerprint(content) {
    const s = content.toLowerCase();
    
    // CJK bigram：连续中文字符两两成组
    const cjkChunks = s.match(/[\u4e00-\u9fff]+/g) || [];
    const bigrams = [];
    cjkChunks.forEach(chunk => {
      for (let i = 0; i < chunk.length - 1; i++) {
        bigrams.push(chunk.substring(i, i + 2));
      }
    });
    
    // 非 CJK 分词：去掉中文后按原逻辑切词
    const words = s.replace(/[\u4e00-\u9fff]/g, ' ')
      .replace(/[^\w]/g, ' ')
      .split(/\s+/)
      .filter(w => w.length > 1);
    
    // 合并去重排序
    return [...new Set([...bigrams, ...words])].sort().join(',');
  }

  // 两条内容相似度：共享词比例
  function similarity(fp1, fp2) {
    if (!fp1 || !fp2) return {ratio: 0, shared: 0};
    const a = fp1.split(',');
    const b = fp2.split(',');
    const shared = a.filter(w => b.includes(w)).length;
    return {ratio: shared / Math.max(a.length, b.length, 1), shared};
  }
  // 去重判定：相对值 ≥ 阈值 或 绝对值 ≥ 6
  function isDuplicate(fp1, fp2) {
    const {ratio, shared} = similarity(fp1, fp2);
    return ratio > 0.55 || shared >= 6;
  }

  const fpCache = [];
  for (let i = 0; i < data.length; i++) {
    fpCache[i] = fingerprint(data[i].content);
    const key = data[i].field; // 只按领域分组，不限日期
    if (!seen[key]) seen[key] = [];

    let isDup = false;
    for (const existing of seen[key]) {
      if (isDuplicate(fpCache[i], fpCache[existing.index])) {
        // 重复：保留更早日期；同日期保留内容更长的
        if (data[i].date < data[existing.index].date) {
          // 当前更早，替换旧的
          const idx = result.findIndex(r => r === data[existing.index]);
          if (idx >= 0) result[idx] = data[i];
          existing.index = i;
          existing.fingerprint = fpCache[i];
        } else if (data[i].date === data[existing.index].date && 
                   data[i].content.length > data[existing.index].content.length) {
          // 同日期，保留更详细的
          const idx = result.findIndex(r => r === data[existing.index]);
          if (idx >= 0) result[idx] = data[i];
          existing.index = i;
          existing.fingerprint = fpCache[i];
        }
        isDup = true;
        break;
      }
    }
    if (!isDup) {
      seen[key].push({index: i, fingerprint: fpCache[i]});
      result.push(data[i]);
    }
  }
  return result;
}

function renderTable(data) {
  data = dedupNews(data);
  const tbody = document.getElementById('news-body');
  tbody.innerHTML = '';
  if (data.length === 0) {
    tbody.innerHTML = '<tr class="empty-msg"><td colspan="7">暂无数据，等待首次早报推送</td></tr>';
  } else {
    const grouped = {};
    data.forEach(item => {
      if (!grouped[item.date]) grouped[item.date] = [];
      grouped[item.date].push(item);
    });
    const dates = Object.keys(grouped).sort().reverse();
    dates.forEach(date => {
      const count = grouped[date].length;
      tbody.innerHTML += `<tr class="date-group"><td colspan="7">${date} · ${count}条</td></tr>`;
      grouped[date].forEach(item => {
        tbody.innerHTML += `
        <tr>
          <td class="date">${date.slice(5)}</td>
          <td class="field">${item.field}</td>
          <td class="company">${item.company || ''}</td>
          <td class="person">${item.person || ''}</td>
          <td class="content">${item.content}</td>
          <td class="impact">${item.impact}</td>
          <td class="source">${item.source}</td>
        </tr>`;
      });
    });
  }
  renderCards(data);
}

function renderCards(data) {
  const wrap = document.getElementById('cards-wrap');
  wrap.innerHTML = '';
  if (data.length === 0) {
    wrap.innerHTML = '<div style="text-align:center;padding:48px;color:var(--muted)">暂无数据，等待首次早报推送</div>';
    return;
  }
  const grouped = {};
  data.forEach(item => {
    if (!grouped[item.date]) grouped[item.date] = [];
    grouped[item.date].push(item);
  });
  const dates = Object.keys(grouped).sort().reverse();
  dates.forEach(date => {
    const count = grouped[date].length;
    wrap.innerHTML += `<div class="date-group-card">${date} · ${count}条</div>`;
    grouped[date].forEach(item => {
      wrap.innerHTML += `
        <div class="card">
          <div class="meta">
            <span class="c-date">${date.slice(5)}</span>
            <span class="c-field">${item.field}</span>
            ${item.company ? `<span class="c-company">${item.company}</span>` : ''}
            ${item.person ? `<span class="c-person">${item.person}</span>` : ''}
          </div>
          <div class="c-content">${item.content}</div>
          <div class="c-impact">${item.impact}</div>
          <div class="c-source">${item.source}</div>
        </div>`;
    });
  });
}

function filterData() {
  const dateVal = document.getElementById('filter-date').value;
  const fieldVal = document.getElementById('filter-field').value;
  const companyVal = document.getElementById('filter-company').value;
  const keyword = document.getElementById('filter-keyword').value.toLowerCase();

  let filtered = newsData;
  if (dateVal) filtered = filtered.filter(item => item.date === dateVal);
  if (fieldVal) filtered = filtered.filter(item => item.field === fieldVal);
  if (companyVal) filtered = filtered.filter(item =>
    item.company && item.company.split('/').map(s => s.trim()).includes(companyVal)
  );
  if (keyword) filtered = filtered.filter(item =>
    item.content.toLowerCase().includes(keyword) ||
    item.impact.toLowerCase().includes(keyword) ||
    item.company.toLowerCase().includes(keyword) ||
    item.person.toLowerCase().includes(keyword)
  );
  renderTable(filtered);
}

document.getElementById('filter-date').addEventListener('change', filterData);
document.getElementById('filter-field').addEventListener('change', filterData);
document.getElementById('filter-company').addEventListener('change', filterData);
document.getElementById('filter-keyword').addEventListener('input', filterData);

// 初次渲染
renderTable(newsData);

// 动态填充日期下拉
(function(){
  const dates = [...new Set(newsData.map(item => item.date))].sort().reverse();
  const sel = document.getElementById('filter-date');
  dates.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
})();

// 动态填充公司下拉
(function(){
  const raw = new Set();
  newsData.forEach(item => {
    if (item.company) item.company.split('/').forEach(c => raw.add(c.trim()));
  });
  const companies = [...raw].filter(Boolean).sort();
  const sel = document.getElementById('filter-company');
  companies.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  // 修正表格中公司名显示：/ → 、
  document.querySelectorAll('td.company').forEach(td => {
    if (td.textContent.includes('/')) {
      td.textContent = td.textContent.split('/').map(s => s.trim()).join('、');
    }
  });
})();

// 表头 sticky（JS 方案·仅桌面端）
(function(){
  const thead = document.querySelector('thead');
  const topBar = document.querySelector('.top-bar');
  if (!thead || !topBar) return;
  // 手机端（table-wrap隐藏时）跳过
  if (window.innerWidth <= 768) return;
  const tr = thead.querySelector('tr');
  const offset = topBar.offsetHeight;
  let fixed = false, placeholder = null, fixTriggerY = 0, fixedDiv = null;

  function check() {
    if (!fixed) {
      const rect = thead.getBoundingClientRect();
      if (rect.top <= offset) {
        fixed = true;
        fixTriggerY = window.scrollY;
        // 克隆表头到独立 fixed div
        fixedDiv = document.createElement('div');
        fixedDiv.className = 'fixed';
        fixedDiv.style.top = offset + 'px';
        fixedDiv.style.left = rect.left + 'px';
        fixedDiv.style.width = thead.offsetWidth + 'px';
        fixedDiv.style.minWidth = '1100px';
        const origThs = Array.from(thead.querySelectorAll('th'));
        const widths = origThs.map(th => th.offsetWidth);
        const headHTML = '<table><thead>' + tr.outerHTML + '</thead></table>';
        fixedDiv.innerHTML = headHTML;
        document.body.appendChild(fixedDiv);
        // 同步列宽
        fixedDiv.querySelectorAll('th').forEach((th, i) => { th.style.width = widths[i] + 'px'; });
        // 占位符
        placeholder = tr.cloneNode(true);
        placeholder.classList.add('thead-spacer');
        thead.insertBefore(placeholder, tr);
        // 隐藏原始表头，避免双表头
        tr.style.visibility = 'hidden';
        // 去掉橙线（visibility不隐藏border）
        tr.querySelectorAll('th').forEach(th => { th.style.borderBottom = 'none'; });
      }
    } else {
      if (window.scrollY < fixTriggerY) {
        fixed = false;
        if (placeholder) placeholder.remove();
        if (fixedDiv) { fixedDiv.remove(); fixedDiv = null; }
        tr.style.visibility = '';
        tr.querySelectorAll('th').forEach(th => { th.style.borderBottom = ''; });
      }
    }
  }
  setInterval(check, 150);
  check();
})();
</script>
